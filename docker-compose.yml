name: islandora

secrets:
  # Development certificates
  CERT_PUBLIC_KEY:
    file: ./dev_certs/cert.pem
  CERT_AUTHORITY:
    file: ./dev_certs/rootCA.pem
  UID:
    file: ./dev_certs/UID

services:
  activemq:
    image: islandora/activemq:${ISLANDORA_TAG:?set ISLANDORA_TAG in .env}
    container_name: activemq
    env_file:
      - ./env_files/base.env
      - ./env_files/activemq.env
    volumes:
      - activemq-data:/opt/activemq/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.activemq.entrypoints=websecure
      - traefik.http.routers.activemq.rule=Host(`activemq.libapps-dev.uncw.edu`)
      - traefik.http.routers.activemq.tls=true
      - traefik.http.routers.activemq.middlewares=jumpbox-whitelist@file
      - traefik.http.services.activemq.loadbalancer.server.port=8161
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "61613"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  blazegraph:
    # No 7.x blazegraph image is published; upstream isle-site-template pins this one.
    image: islandora/blazegraph:6.4.3@sha256:015e308ae0a296cdb87c83c10da976ed970d2bfa971290aa1147593df8cf445d
    container_name: blazegraph
    volumes:
      - blazegraph-data:/data
    env_file:
      - ./env_files/base.env
      # - ./env_files/blazegraph.env
    labels:
      - traefik.enable=true
      - traefik.http.routers.blazegraph.entrypoints=websecure
      - traefik.http.routers.blazegraph.rule=Host(`blazegraph.libapps-dev.uncw.edu`)
      - traefik.http.routers.blazegraph.tls=true
      - traefik.http.routers.blazegraph.middlewares=jumpbox-whitelist@file
      - traefik.http.services.blazegraph.loadbalancer.server.port=8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/bigdata/"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  cantaloupe:
    image: islandora/cantaloupe:${ISLANDORA_TAG:?set ISLANDORA_TAG in .env}
    container_name: cantaloupe
    env_file:
      - ./env_files/base.env
      - ./env_files/cantaloupe.env
    secrets:
      - source: CERT_PUBLIC_KEY
      - source: CERT_AUTHORITY
    volumes:
      - cantaloupe-data:/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.cantaloupe.entrypoints=websecure
      - traefik.http.routers.cantaloupe.rule=Host(`islandora.libapps-dev.uncw.edu`) && PathPrefix(`/cantaloupe`)
      - traefik.http.routers.cantaloupe.tls=true
      - traefik.http.routers.cantaloupe.middlewares=cantaloupe-chain@file,jumpbox-whitelist@file
      - traefik.http.routers.cantaloupe.priority=100
      - traefik.http.services.cantaloupe.loadbalancer.server.port=8182
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -s localhost:8182/health | grep -q '\"color\":\"GREEN\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  islandora:
    image: uncwlibrary/islandora-drupal:${ISLANDORA_TAG:?set ISLANDORA_TAG in .env}
    container_name: islandora
    env_file:
      - ./env_files/base.env
      - ./env_files/jwt.env
      - ./env_files/jwt_private.env
      - ./env_files/drupal.env
    secrets:
      - source: CERT_PUBLIC_KEY
      - source: CERT_AUTHORITY
      - source: UID
    labels:
      - traefik.enable=true
      - traefik.http.routers.islandora.entrypoints=websecure
      - traefik.http.routers.islandora.rule=Host(`islandora.libapps-dev.uncw.edu`)
      - traefik.http.routers.islandora.tls=true
      - traefik.http.routers.islandora.priority=1
      - traefik.http.services.islandora.loadbalancer.server.port=80
    volumes:
      - ./mounted/drupal/files:/var/www/drupal/web/sites/default/files
      - ./mounted/drupal/private:/var/www/drupal/private
    depends_on:
      - mariadb
      - activemq
      - fcrepo
    healthcheck:
      test: ["CMD", "curl", "-f", "-H", "Host: islandora.libapps-dev.uncw.edu", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  fcrepo:
    image: islandora/fcrepo:${ISLANDORA_TAG:?set ISLANDORA_TAG in .env}
    container_name: fcrepo
    env_file:
      - ./env_files/base.env
      - ./env_files/jwt.env
      - ./env_files/fcrepo.env
    secrets:
     - source: CERT_PUBLIC_KEY
     - source: CERT_AUTHORITY
    labels:
      # Due to weird logic in `fcrepo/static/js/common.js`, do not use https
      # as it assumes it always needs to append /fcr:metadata to every request
      # breaking the links. Though for files we do want that page to be accessed
      # so check for a file extension.
      - traefik.enable=true
      - traefik.http.routers.fcrepo.entrypoints=websecure
      - traefik.http.routers.fcrepo.rule=Host(`fcrepo.libapps-dev.uncw.edu`)
      - traefik.http.routers.fcrepo.tls=true
      - traefik.http.routers.fcrepo.middlewares=fcrepo-strip-suffix@file,jumpbox-whitelist@file
      - traefik.http.services.fcrepo.loadbalancer.server.port=8080
    volumes:
      - ./mounted/fcrepo/data:/data
    depends_on:
      - activemq
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/fcrepo/rest/"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  mariadb:
    image: mariadb:13.0
    container_name: mariadb
    env_file:
      - ./env_files/base.env
      - ./env_files/mariadb.env
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./db_autoimport:/docker-entrypoint-initdb.d/
    restart: unless-stopped

  solr:
    image: uncwlibrary/islandora-solr:${ISLANDORA_TAG:?set ISLANDORA_TAG in .env}
    container_name: solr
    volumes:
      - solr-data:/opt/solr/server/solr/default/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.solr.entrypoints=websecure
      - traefik.http.routers.solr.rule=Host(`solr.libapps-dev.uncw.edu`)
      - traefik.http.routers.solr.tls=true
      - traefik.http.routers.solr.middlewares=jumpbox-whitelist@file
      - traefik.http.services.solr.loadbalancer.server.port=8983
    env_file:
      - ./env_files/base.env
      # - ./env_files/solr.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8983/solr/"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # Microservices
  alpaca:
    image: islandora/alpaca:${ISLANDORA_TAG:?set ISLANDORA_TAG in .env}
    container_name: alpaca
    env_file:
      - ./env_files/base.env
      - ./env_files/alpaca.env
    secrets:
      - source: CERT_PUBLIC_KEY
      - source: CERT_AUTHORITY
    depends_on:
      - activemq
    healthcheck:
      test: ["CMD", "pgrep", "-f", "java"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  crayfits:
    image: islandora/crayfits:${ISLANDORA_TAG:?set ISLANDORA_TAG in .env}
    container_name: crayfits
    env_file:
      - ./env_files/base.env
      # - ./env_files/crayfits.env
    secrets:
      - source: CERT_PUBLIC_KEY
      - source: CERT_AUTHORITY
    restart: unless-stopped

  fits:
    image: islandora/fits:${ISLANDORA_TAG:?set ISLANDORA_TAG in .env}
    container_name: fits
    env_file:
      - ./env_files/base.env
      - ./env_files/fits.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/fits/"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  homarus:
    image: islandora/homarus:${ISLANDORA_TAG:?set ISLANDORA_TAG in .env}
    container_name: homarus
    env_file:
      - ./env_files/base.env
      # - ./env_files/homarus.env
    secrets:
      - source: CERT_PUBLIC_KEY
      - source: CERT_AUTHORITY
    restart: unless-stopped

  houdini:
    image: islandora/houdini:${ISLANDORA_TAG:?set ISLANDORA_TAG in .env}
    container_name: houdini
    env_file:
      - ./env_files/base.env
      # - ./env_files/houdini.env
    secrets:
      - source: CERT_PUBLIC_KEY
      - source: CERT_AUTHORITY
    restart: unless-stopped

  hypercube:
    image: islandora/hypercube:${ISLANDORA_TAG:?set ISLANDORA_TAG in .env}
    container_name: hypercube
    env_file:
      - ./env_files/base.env
      # - ./env_files/hypercube.env
    secrets:
      - source: CERT_PUBLIC_KEY
      - source: CERT_AUTHORITY
    restart: unless-stopped

  mergepdf:
    image: islandora/mergepdf:${ISLANDORA_TAG:?set ISLANDORA_TAG in .env}
    container_name: mergepdf
    env_file:
      - ./env_files/base.env
      # - ./env_files/mergepdf.env
    secrets:
      - source: CERT_PUBLIC_KEY
      - source: CERT_AUTHORITY
    restart: unless-stopped

  milliner:
    image: islandora/milliner:${ISLANDORA_TAG:?set ISLANDORA_TAG in .env}
    container_name: milliner
    env_file:
      - ./env_files/base.env
      - ./env_files/jwt.env
      - ./env_files/milliner.env
    secrets:
      - source: CERT_PUBLIC_KEY
      - source: CERT_AUTHORITY
    restart: unless-stopped

networks:
  default:
    name: traefik_net
    external: true

volumes:
  activemq-data: {}
  blazegraph-data: {}
  cantaloupe-data: {}
  mariadb-data: {}
  solr-data: {}
