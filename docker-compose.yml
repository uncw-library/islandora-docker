name: islandora

secrets:
    # Development certificates
    CERT_PUBLIC_KEY:
        file: ./dev_certs/cert.pem
    CERT_AUTHORITY:
        file: ./dev_certs/rootCA.pem
    UID:
        file: ./dev_certs/UID

services:
  activemq:
    image: islandora/activemq:7.0.18
    container_name: activemq
    env_file:
      - ./env_files/base.env
      - ./env_files/activemq.env
    volumes:
      - activemq-data:/opt/activemq/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.activemq.entrypoints=websecure
      - traefik.http.routers.activemq.rule=Host(`activemq.islandora.dev`)
      - traefik.http.routers.activemq.tls=true
      - traefik.http.services.activemq.loadbalancer.server.port=8161
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "61613"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  blazegraph:
    # No 7.x blazegraph image is published; upstream isle-site-template pins this one.
    image: islandora/blazegraph:6.4.3@sha256:015e308ae0a296cdb87c83c10da976ed970d2bfa971290aa1147593df8cf445d
    container_name: blazegraph
    volumes:
      - blazegraph-data:/data
    env_file:
      - ./env_files/base.env
      # - ./env_files/blazegraph.env
    labels:
      - traefik.enable=true
      - traefik.http.routers.blazegraph.entrypoints=websecure
      - traefik.http.routers.blazegraph.rule=Host(`blazegraph.islandora.dev`)
      - traefik.http.routers.blazegraph.tls=true
      - traefik.http.services.blazegraph.loadbalancer.server.port=8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/bigdata/"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  cantaloupe:
    image: islandora/cantaloupe:7.0.18
    container_name: cantaloupe
    env_file:
      - ./env_files/base.env
      - ./env_files/cantaloupe.env
    secrets:
      - source: CERT_PUBLIC_KEY
      - source: CERT_AUTHORITY
    volumes:
      - cantaloupe-data:/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.cantaloupe.middlewares=cantaloupe-chain@file
      - traefik.http.routers.cantaloupe.entrypoints=websecure
      - traefik.http.routers.cantaloupe.rule=Host(`islandora.dev`) && PathPrefix(`/cantaloupe`)
      - traefik.http.routers.cantaloupe.tls=true
      - traefik.http.services.cantaloupe.loadbalancer.server.port=8182
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -s localhost:8182/health | grep -q '\"color\":\"GREEN\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  drupal:
    image: uncwlibrary/islandora-drupal:7.0.18
    container_name: drupal
    build:
      context: ./drupal
      args:
        REPOSITORY: islandora
        TAG: 7.0.18
    env_file:
      - ./env_files/base.env
      - ./env_files/jwt.env
      - ./env_files/jwt_private.env
      - ./env_files/drupal.env
    secrets:
      - source: CERT_PUBLIC_KEY
      - source: CERT_AUTHORITY
      - source: UID
    labels:
      - traefik.enable=true
      - traefik.http.routers.drupal.entrypoints=websecure
      - traefik.http.routers.drupal.rule=Host(`islandora.dev`)
      - traefik.http.routers.drupal.tls=true
      - traefik.http.routers.drupal.middlewares=dev-security-headers
      - traefik.http.services.drupal.loadbalancer.server.port=80
    volumes:
      - ./mounted/drupal/files:/var/www/drupal/web/sites/default/files
      - drupal-private-files:/var/www/drupal/private
      # - ./drupal/rootfs/var/www/drupal/assets:/var/www/drupal/assets
      # - ./drupal/rootfs/var/www/drupal/composer.json:/var/www/drupal/composer.json
      # - ./drupal/rootfs/var/www/drupal/composer.lock:/var/www/drupal/composer.lock
      # - ./drupal/rootfs/var/www/drupal/config:/var/www/drupal/config
      # - ./drupal/rootfs/var/www/drupal/web/modules/custom:/var/www/drupal/web/modules/custom
      # - ./drupal/rootfs/var/www/drupal/web/themes/custom:/var/www/drupal/web/themes/custom
    depends_on:
      - mariadb
      - activemq
      - fcrepo
    healthcheck:
      test: ["CMD", "curl", "-f", "-H", "Host: islandora.dev", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  fcrepo:
    image: islandora/fcrepo:7.0.18
    container_name: fcrepo
    env_file:
      - ./env_files/base.env
      - ./env_files/jwt.env
      - ./env_files/fcrepo.env
    secrets:
      - source: CERT_PUBLIC_KEY
      - source: CERT_AUTHORITY
    labels:
      # Due to weird logic in `fcrepo/static/js/common.js`, do not use https
      # as it assumes it always needs to append /fcr:metadata to every request
      # breaking the links. Though for files we do want that page to be accessed
      # so check for a file extension.
      - traefik.enable=true
      - traefik.http.routers.fcrepo.entrypoints=websecure
      - traefik.http.routers.fcrepo.middlewares=fcrepo-strip-suffix@file
      - traefik.http.routers.fcrepo.rule=Host(`fcrepo.islandora.dev`)
      - traefik.http.routers.fcrepo.tls=true
      - traefik.http.services.fcrepo.loadbalancer.server.port=8080
    volumes:
      - ./mounted/fcrepo/data:/data
    depends_on:
      - activemq
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/fcrepo/rest/"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  mariadb:
    image: mariadb:13.0
    container_name: mariadb
    env_file:
      - ./env_files/base.env
      - ./env_files/mariadb.env
    ports:
      - "3306:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./db_autoimport:/docker-entrypoint-initdb.d/
    restart: unless-stopped

  solr:
    # islandora/solr:7.0.18 plus the core config in ./solr/default (see ./solr/Dockerfile).
    # After changing anything in ./solr: docker compose build solr && docker compose up -d solr
    image: uncwlibrary/islandora-solr:7.0.18
    container_name: solr
    build:
      context: ./solr
    volumes:
      - solr-data:/opt/solr/server/solr/default/data
    labels:
        - traefik.enable=true
        - traefik.http.routers.solr.entrypoints=websecure
        - traefik.http.routers.solr.rule=Host(`solr.islandora.dev`)
        - traefik.http.routers.solr.tls=true
        - traefik.http.services.solr.loadbalancer.server.port=8983
    env_file:
      - ./env_files/base.env
      # - ./env_files/solr.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8983/solr/"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  traefik:
    image: traefik:latest
    container_name: traefik
    hostname: islandora.dev
    env_file:
      - ./env_files/base.env
      - ./env_files/traefik.env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/traefik.yml:ro
      - ./traefik/config:/config
      - ./dev_certs:/etc/ssl/traefik:Z,ro
    ports:
      - "80:80"
      - "443:443"
    # islandora.dev resolves to 127.0.0.1 in public DNS, which inside a container
    # is the container itself.  These aliases send in-network requests for the
    # public hostnames (e.g. milliner -> https://islandora.dev/media/1) to traefik.
    networks:
      default:
        aliases:
          - islandora.dev
          - activemq.islandora.dev
          - blazegraph.islandora.dev
          - fcrepo.islandora.dev
          - solr.islandora.dev
    labels:
      - traefik.enable=true
      # Development security headers - disable HSTS for self-signed certs
      - traefik.http.middlewares.dev-security-headers.headers.customresponseheaders.Strict-Transport-Security=""
      - traefik.http.middlewares.dev-security-headers.headers.customresponseheaders.X-Frame-Options="SAMEORIGIN"
      - traefik.http.routers.traefik_https.middlewares=dev-security-headers

      - traefik.http.routers.dashboard-insecure.entrypoints=web
      - traefik.http.routers.dashboard-insecure.rule=Host(`traefik.islandora.dev`) && (PathPrefix(`/dashboard`) || PathPrefix(`/api/`))
      - traefik.http.routers.dashboard-insecure.service=api@internal
      - traefik.http.routers.dashboard.entrypoints=websecure
      - traefik.http.routers.dashboard.rule=Host(`traefik.islandora.dev`) && (PathPrefix(`/dashboard`) || PathPrefix(`/api/`))
      - traefik.http.routers.dashboard.service=api@internal
      - traefik.http.routers.dashboard.tls=true
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # Microservices
  alpaca:
    image: islandora/alpaca:7.0.18
    container_name: alpaca
    env_file:
      - ./env_files/base.env
      - ./env_files/alpaca.env
    secrets:
      - source: CERT_PUBLIC_KEY
      - source: CERT_AUTHORITY
    depends_on:
      - activemq
    healthcheck:
      test: ["CMD", "pgrep", "-f", "java"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  crayfits:
    image: islandora/crayfits:7.0.18
    container_name: crayfits
    env_file:
      - ./env_files/base.env
      # - ./env_files/crayfits.env
    secrets:
      - source: CERT_PUBLIC_KEY
      - source: CERT_AUTHORITY
    restart: unless-stopped

  fits:
    image: islandora/fits:7.0.18
    container_name: fits
    env_file:
      - ./env_files/base.env
      - ./env_files/fits.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/fits/"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  homarus:
    image: islandora/homarus:7.0.18
    container_name: homarus
    env_file:
      - ./env_files/base.env
      # - ./env_files/homarus.env
    secrets:
      - source: CERT_PUBLIC_KEY
      - source: CERT_AUTHORITY
    restart: unless-stopped

  houdini:
    image: islandora/houdini:7.0.18
    container_name: houdini
    env_file:
      - ./env_files/base.env
      # - ./env_files/houdini.env
    secrets:
      - source: CERT_PUBLIC_KEY
      - source: CERT_AUTHORITY
    restart: unless-stopped

  hypercube:
    image: islandora/hypercube:7.0.18
    container_name: hypercube
    env_file:
      - ./env_files/base.env
      # - ./env_files/hypercube.env
    secrets:
      - source: CERT_PUBLIC_KEY
      - source: CERT_AUTHORITY
    restart: unless-stopped

  mergepdf:
    image: islandora/mergepdf:7.0.18
    container_name: mergepdf
    env_file:
      - ./env_files/base.env
      # - ./env_files/mergepdf.env
    secrets:
      - source: CERT_PUBLIC_KEY
      - source: CERT_AUTHORITY
    restart: unless-stopped

  milliner:
    image: islandora/milliner:7.0.18
    container_name: milliner
    env_file:
      - ./env_files/base.env
      - ./env_files/jwt.env
      - ./env_files/milliner.env
    secrets:
      - source: CERT_PUBLIC_KEY
      - source: CERT_AUTHORITY
    restart: unless-stopped

networks:
  default:
    name: traefik_net

volumes:
  activemq-data: {}
  blazegraph-data: {}
  cantaloupe-data: {}
  drupal-private-files: {}
  mariadb-data: {}
  solr-data: {}
