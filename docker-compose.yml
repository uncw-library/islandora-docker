name: islandora

services:
  activemq:
    image: islandora/activemq:7.0.18
    container_name: activemq
    env_file:
      - ./env_files/base.env
      - ./env_files/activemq.env
    volumes:
      - activemq-data:/opt/activemq/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.activemq.entrypoints=websecure
      - traefik.http.routers.activemq.rule=Host(`activemq.libapps-dev.uncw.edu`)
      - traefik.http.routers.activemq.tls=true
      - traefik.http.services.activemq.loadbalancer.server.port=8161
      - traefik.http.routers.activemq.middlewares=jumpbox-whitelist@file
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "61613"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  blazegraph:
    # No 7.x blazegraph image is published; upstream isle-site-template pins this one.
    image: islandora/blazegraph:6.4.3@sha256:015e308ae0a296cdb87c83c10da976ed970d2bfa971290aa1147593df8cf445d
    container_name: blazegraph
    volumes:
      - blazegraph-data:/data
    env_file:
      - ./env_files/base.env
      # - ./env_files/blazegraph.env
    labels:
      - traefik.enable=true
      - traefik.http.routers.blazegraph.entrypoints=websecure
      - traefik.http.routers.blazegraph.rule=Host(`blazegraph.libapps-dev.uncw.edu`)
      - traefik.http.routers.blazegraph.tls=true
      - traefik.http.services.blazegraph.loadbalancer.server.port=8080
      - traefik.http.routers.blazegraph.middlewares=jumpbox-whitelist@file
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/bigdata/"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  cantaloupe:
    image: islandora/cantaloupe:7.0.18
    container_name: cantaloupe
    env_file:
      - ./env_files/base.env
      - ./env_files/cantaloupe.env
    secrets:
      - source: CERT_PUBLIC_KEY
      - source: CERT_AUTHORITY
    volumes:
      - cantaloupe-data:/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.cantaloupe.middlewares=cantaloupe-chain@file
      - traefik.http.routers.cantaloupe.entrypoints=websecure
      - traefik.http.routers.cantaloupe.rule=Host(`libapps-dev.uncw.edu`) && PathPrefix(`/cantaloupe`)
      - traefik.http.routers.cantaloupe.tls=true
      - traefik.http.services.cantaloupe.loadbalancer.server.port=8182
      - traefik.http.routers.cantaloupe.middlewares=jumpbox-whitelist@file
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -s localhost:8182/health | grep -q '\"color\":\"GREEN\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  drupal:
    image: uncwlibrary/islandora-drupal:7.0.18
    container_name: drupal
    build:
      context: ./drupal
      args:
        REPOSITORY: islandora
        TAG: 7.0.18
    env_file:
      - ./env_files/base.env
      - ./env_files/jwt.env
      - ./env_files/jwt_private.env
      - ./env_files/drupal.env
    labels:
      - traefik.enable=true
      - traefik.http.routers.drupal.entrypoints=websecure
      - traefik.http.routers.drupal.rule=Host(`libapps-dev.uncw.edu`)
      - traefik.http.routers.drupal.tls=true
      - traefik.http.services.drupal.loadbalancer.server.port=80
    volumes:
      - ./mounted/drupal/files:/var/www/drupal/web/sites/default/files
      - ./mounted/drupal/private:/var/www/drupal/private
    depends_on:
      - mariadb
      - activemq
      - fcrepo
    healthcheck:
      test: ["CMD", "curl", "-f", "-H", "Host: libapps-dev.uncw.edu", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  fcrepo:
    image: islandora/fcrepo:7.0.18
    container_name: fcrepo
    env_file:
      - ./env_files/base.env
      - ./env_files/jwt.env
      - ./env_files/fcrepo.env
    labels:
      # Due to weird logic in `fcrepo/static/js/common.js`, do not use https
      # as it assumes it always needs to append /fcr:metadata to every request
      # breaking the links. Though for files we do want that page to be accessed
      # so check for a file extension.
      - traefik.enable=true
      - traefik.http.routers.fcrepo.entrypoints=websecure
      - traefik.http.routers.fcrepo.middlewares=fcrepo-strip-suffix@file
      - traefik.http.routers.fcrepo.rule=Host(`fcrepo.libapps-dev.uncw.edu`)
      - traefik.http.routers.fcrepo.tls=true
      - traefik.http.services.fcrepo.loadbalancer.server.port=8080
      - traefik.http.routers.fcrepo.middlewares=jumpbox-whitelist@file
    volumes:
      - ./mounted/fcrepo/data:/data
    depends_on:
      - activemq
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/fcrepo/rest/"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  solr:
    # islandora/solr:7.0.18 plus the core config in ./solr/default (see ./solr/Dockerfile).
    # After changing anything in ./solr: docker compose build solr && docker compose up -d solr
    image: uncwlibrary/islandora-solr:7.0.18
    container_name: solr
    build:
      context: ./solr
    volumes:
      - solr-data:/opt/solr/server/solr/default/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.solr.entrypoints=websecure
      - traefik.http.routers.solr.rule=Host(`solr.libapps-dev.uncw.edu`)
      - traefik.http.routers.solr.tls=true
      - traefik.http.services.solr.loadbalancer.server.port=8983
      - traefik.http.routers.solr.middlewares=jumpbox-whitelist@file
    env_file:
      - ./env_files/base.env
      # - ./env_files/solr.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8983/solr/"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # Microservices
  alpaca:
    image: islandora/alpaca:7.0.18
    container_name: alpaca
    env_file:
      - ./env_files/base.env
      - ./env_files/alpaca.env
    depends_on:
      - activemq
    healthcheck:
      test: ["CMD", "pgrep", "-f", "java"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  crayfits:
    image: islandora/crayfits:7.0.18
    container_name: crayfits
    env_file:
      - ./env_files/base.env
      # - ./env_files/crayfits.env
    restart: unless-stopped

  fits:
    image: islandora/fits:7.0.18
    container_name: fits
    env_file:
      - ./env_files/base.env
      - ./env_files/fits.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/fits/"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  homarus:
    image: islandora/homarus:7.0.18
    container_name: homarus
    env_file:
      - ./env_files/base.env
      # - ./env_files/homarus.env
    restart: unless-stopped

  houdini:
    image: islandora/houdini:7.0.18
    container_name: houdini
    env_file:
      - ./env_files/base.env
      # - ./env_files/houdini.env
    restart: unless-stopped

  hypercube:
    image: islandora/hypercube:7.0.18
    container_name: hypercube
    env_file:
      - ./env_files/base.env
      # - ./env_files/hypercube.env
    restart: unless-stopped

  mergepdf:
    image: islandora/mergepdf:7.0.18
    container_name: mergepdf
    env_file:
      - ./env_files/base.env
      # - ./env_files/mergepdf.env
    restart: unless-stopped

  milliner:
    image: islandora/milliner:7.0.18
    container_name: milliner
    env_file:
      - ./env_files/base.env
      - ./env_files/jwt.env
      - ./env_files/milliner.env
    restart: unless-stopped

networks:
  default:
    name: traefik_net
    external: true

volumes:
  activemq-data: {}
  blazegraph-data: {}
  cantaloupe-data: {}
  drupal-private-files: {}
  mariadb-data: {}
  solr-data: {}
