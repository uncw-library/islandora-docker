uuid: ca18a5e3-5510-4c21-b149-a6c6a9e1b143
langcode: en
status: true
dependencies:
  enforced:
    config:
      - islandora_spreadsheet_ingest.request.space_exploration_test
id: isi__space_exploration_test_isi_file
class: null
field_plugin_method: null
cck_plugin_method: null
migration_tags:
  - isi_template
migration_group: isi__space_exploration_test
label: 'Create files from rows in the csv.'
source: {  }
process:
  _file_defined:
    -
      plugin: get
      source: Digital_File
    -
      plugin: skip_on_empty
      method: row
      message: 'Field Digital_File is missing'
    -
      plugin: file_is_accessible
  _destination_filename:
    -
      plugin: get
      source: '@_file_defined'
    -
      plugin: callback
      callable: basename
  _dest_dir:
    -
      plugin: default_value
      default_value: 'private:/'
  _date_chunk:
    -
      plugin: default_value
      default_value: Y-m
    -
      plugin: callback
      callable: date
  _dest_path:
    -
      plugin: concat
      source:
        - '@_dest_dir'
        - '@_date_chunk'
        - '@_destination_filename'
      delimiter: /
    -
      plugin: urlencode
    -
      plugin: dgi_migrate.process.log
      template: 'Destination Full Path: :value'
      level: 4
  uri:
    -
      plugin: file_copy
      source:
        - Digital_File
        - '@_dest_path'
      file_exists: rename
      move: false
  filemime:
    -
      plugin: get
      source: '@_dest_path'
    -
      plugin: callback
      callable: mime_content_type
  filename:
    -
      plugin: get
      source: '@_destination_filename'
  status:
    -
      plugin: default_value
      default_value: 1
  filesize:
    -
      plugin: get
      source: '@uri'
    -
      plugin: callback
      callable: filesize
destination:
  plugin: 'entity:file'
  validate: true
idMap:
  plugin: smart_sql
migration_dependencies:
  required: {  }
  optional: {  }
include: null
